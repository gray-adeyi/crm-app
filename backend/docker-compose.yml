services:
  app:
    user: "${UID}:${GID}"
    build: .
    image: crm-app:latest
    command: run fastapi dev --app app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - "/backennd/.venv"
      - ".:/backend"
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - database
    restart: on-failure

  database:
    image: docker.io/postgres
    env_file:
      - .env
    volumes:
      - crm-app-volume:/var/lib/postgresql
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d/

volumes:
  crm-app-volume:
