# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

dotenv: [.env]

tasks:
  default:
    cmds:
      - echo "Setting up {{.PROJECT_NAME}} for development"
      - task: backend:init
      - task: backend:build-image
      - task: backend:up
      - task: backend:migrate
  backend:init:
    dir: backend
    cmds:
      - uv sync
      - uv run pre-commit install
  backend:make-migrations:
    dir: backend
    cmds:
      - '{{.CONTAINER_COMPOSER}} exec app uv run alembic revision --autogenerate -m "{{.MSG}}"'
  backend:migrate:
    dir: backend
    cmds:
      - '{{.CONTAINER_COMPOSER}} exec app uv run alembic upgrade head'
  backend:build-image:
    dir: backend
    cmds:
      - '{{.CONTAINER_RUNTIME}} build -t {{.IMAGE_NAME}}:{{.IMAGE_VERSION}} --build-arg CREATED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
      --build-arg REVISION=$(git rev-parse HEAD) --build-arg VERSION="{{.IMAGE_VERSION}}" --build-arg USER_UID=$(id -u)
       --build-arg USER_GID=$(id -g) .'
  backend:up:
    dir: backend
    cmds:
      - '{{.CONTAINER_COMPOSER}} up -d'
  backend:down:
    dir: backend
    cmds:
      - '{{.CONTAINER_COMPOSER}} down'
  backend:lint:
    dir: backend
    cmds:
      - uvx ty check -W .
    interactive: true
